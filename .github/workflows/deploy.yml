name: Deploy CMS to Hostinger VPS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Next.js CMS Admin
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:5010/api' }}

  deploy:
    name: Sync & Deploy to Hostinger VPS
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Verify Hostinger Secrets Configured
        id: check_secrets
        run: |
          if [ -z "${{ secrets.HOSTINGER_SSH_HOST }}" ] || ( [ -z "${{ secrets.HOSTINGER_SSH_KEY }}" ] && [ -z "${{ secrets.HOSTINGER_SSH_PASSWORD }}" ] ); then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning title=Hostinger Secrets Pending::HOSTINGER_SSH_HOST and either HOSTINGER_SSH_KEY or HOSTINGER_SSH_PASSWORD must be set in repository Settings -> Secrets and variables -> Actions. Skipping VPS deployment."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Hostinger VPS via SSH
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'root' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 15m
          script_stop: true
          script: |
            TARGET_DIR="${{ secrets.HOSTINGER_CMS_DIR || '/var/www/Drop_CMS' }}"
            echo "🚀 Deploying CMS to $TARGET_DIR on Hostinger VPS..."
            
            if [ ! -d "$TARGET_DIR" ]; then
              echo "Directory $TARGET_DIR does not exist. Creating and cloning..."
              mkdir -p "$TARGET_DIR"
              git clone https://github.com/${{ github.repository }}.git "$TARGET_DIR"
            fi
            
            cd "$TARGET_DIR"
            
            # Ensure origin points to the triggering repository and sync latest main
            git remote set-url origin https://github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main
            
            echo "📦 Clearing stale Next cache and compiling fresh production build..."
            rm -rf .next/cache
            npm ci
            npm run build
            
            echo "🔄 Restarting CMS application across PM2 / systemd / port 3001..."
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart drop-cms --update-env || pm2 restart all || true
              pm2 save || true
            fi
            
            if id "ubuntu" >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1; then
              sudo -u ubuntu -i pm2 restart drop-cms --update-env 2>/dev/null || sudo -u ubuntu -i pm2 restart all 2>/dev/null || true
            fi
            
            systemctl restart drop-cms 2>/dev/null || systemctl restart cms 2>/dev/null || true
            
            fuser -k -TERM 3001/tcp 2>/dev/null || true
            sleep 3
            
            if ! ss -lnt 2>/dev/null | grep -q ":3001 "; then
              echo "Starting CMS on port 3001..."
              if command -v pm2 >/dev/null 2>&1; then
                pm2 start npm --name "drop-cms" -- start -- -p 3001
                pm2 save || true
              else
                nohup npm start -- -p 3001 > /var/log/drop-cms.log 2>&1 &
              fi
            fi
            
            echo "✅ CMS deployment complete!"
